name: Windows smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Windows PowerShell smoke test
        shell: powershell
        run: .\tests\SmokeTest.ps1
